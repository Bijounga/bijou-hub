name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the DMG to (e.g. v1.2.0)"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish BijouHub.Mac/BijouHub.Mac.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -o publish-mac

      - name: Assemble .app bundle
        run: |
          APP="BijouHub.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp -R publish-mac/* "$APP/Contents/MacOS/"
          cp BijouHub.Mac/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/BijouHub.Mac"

      - name: Ad-hoc code sign
        # No paid Apple Developer certificate to sign with, but Apple Silicon refuses to run
        # ANY unsigned binary at all (not just a Gatekeeper warning — a hard "is damaged and
        # can't be opened" refusal), even for free/unsigned distribution. An ad-hoc signature
        # (identity "-") satisfies that requirement without needing a certificate. Sign the
        # nested native libraries first, then the outer bundle, so the bundle's seal covers
        # already-signed content correctly.
        run: |
          find BijouHub.app/Contents/MacOS -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - BijouHub.app
          codesign --verify --verbose BijouHub.app

      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R BijouHub.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "BijouHub" -srcfolder dmg-root -ov -format UDZO "BijouHub-${{ matrix.rid }}.dmg"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          gh release upload "$TAG" "BijouHub-${{ matrix.rid }}.dmg" --clobber --repo "${{ github.repository }}"
