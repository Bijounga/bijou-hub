name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the DMG to (e.g. v1.2.0)"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish BijouHub.Mac/BijouHub.Mac.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -o publish-mac

      - name: Assemble .app bundle
        run: |
          APP="BijouHub.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp -R publish-mac/* "$APP/Contents/MacOS/"
          cp BijouHub.Mac/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/BijouHub.Mac"

      - name: Generate app icon
        run: |
          SRC="BijouHub.Mac/Packaging/icon-source.png"
          ICONSET="icon.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "BijouHub.app/Contents/Resources/icon.icns"

      # --- Signing -------------------------------------------------------
      # Two paths, chosen automatically by whether a real certificate is
      # configured. Without one, we fall back to ad-hoc signing (identity
      # "-"), which only satisfies Apple Silicon's "must be signed at all"
      # requirement and gets no Gatekeeper trust — every fresh download
      # still shows the "unidentified developer" prompt once. With a
      # Developer ID Application certificate (APPLE_CERTIFICATE_P12_BASE64
      # etc. set as repo secrets), we sign with hardened runtime + the
      # entitlements .NET's JIT needs, then notarize with Apple and staple
      # the ticket — that's what makes Gatekeeper trust it silently.
      - name: Determine signing mode
        id: signing
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'full'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Code sign (ad-hoc)
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          find BijouHub.app/Contents/MacOS -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - BijouHub.app
          codesign --verify --verbose BijouHub.app

      - name: Code sign (Developer ID + hardened runtime)
        if: steps.signing.outputs.mode == 'full'
        env:
          IDENTITY: "Developer ID Application: ${{ secrets.APPLE_DEVELOPER_NAME }} (${{ secrets.APPLE_TEAM_ID }})"
        run: |
          find BijouHub.app/Contents/MacOS -type f \( -name "*.dylib" -o -perm +111 \) \
            -exec codesign --force --options runtime --entitlements BijouHub.Mac/Packaging/entitlements.plist --sign "$IDENTITY" {} \;
          codesign --force --deep --options runtime --entitlements BijouHub.Mac/Packaging/entitlements.plist --sign "$IDENTITY" BijouHub.app
          codesign --verify --verbose BijouHub.app

      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'full'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent BijouHub.app BijouHub-notarize.zip
          xcrun notarytool submit BijouHub-notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple BijouHub.app
          rm -f BijouHub-notarize.zip
      # ---------------------------------------------------------------

      - name: Create styled DMG
        # A plain `hdiutil create -srcfolder` gives a bare Finder window with small default
        # icons. Build it the way a normal Mac installer looks instead: a read-write image,
        # laid out via Finder/AppleScript (big icons, app on the left, an Applications
        # shortcut on the right so the user just drags one onto the other), then flattened to
        # a compressed read-only DMG for distribution.
        run: |
          mkdir -p dmg-root
          cp -R BijouHub.app dmg-root/
          ln -s /Applications dmg-root/Applications

          VOL_NAME="BijouHub"
          hdiutil create -volname "$VOL_NAME" -srcfolder dmg-root -ov -format UDRW -size 200m rw-temp.dmg
          MOUNT_DIR="/Volumes/$VOL_NAME"
          hdiutil attach rw-temp.dmg -readwrite -noverify -noautoopen

          osascript <<EOF
          tell application "Finder"
            tell disk "$VOL_NAME"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 760, 480}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 128
              set position of item "BijouHub.app" of container window to {140, 160}
              set position of item "Applications" of container window to {420, 160}
              close
              open
              update without registering applications
              delay 2
            end tell
          end tell
          EOF

          sync
          hdiutil detach "$MOUNT_DIR"
          hdiutil convert rw-temp.dmg -format UDZO -o "BijouHub-${{ matrix.rid }}.dmg"
          rm -f rw-temp.dmg

      - name: Staple DMG
        if: steps.signing.outputs.mode == 'full'
        run: xcrun stapler staple "BijouHub-${{ matrix.rid }}.dmg"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          gh release upload "$TAG" "BijouHub-${{ matrix.rid }}.dmg" --clobber --repo "${{ github.repository }}"
