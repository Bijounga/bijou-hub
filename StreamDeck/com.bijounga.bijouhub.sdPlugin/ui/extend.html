<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BijouHub Add Time</title>
<style>
	:root { --bg: #2d2d2d; --field: #3d3d3d; --field-hover: #454545; --ink: #d8d8d8; --muted: #969696; --accent: #33e1ff; --bad: #ff5c6c; }
	* { box-sizing: border-box; }
	html, body { margin: 0; background: var(--bg); color: var(--ink); font: 9pt "Segoe UI", system-ui, sans-serif; user-select: none; }
	body { padding: 8px 12px 14px 0; }
	.row { display: grid; grid-template-columns: 96px 1fr; gap: 0 10px; margin: 0 0 8px; }
	.row > label { text-align: right; color: var(--muted); padding-top: 5px; }
	input { width: 100%; height: 26px; padding: 0 8px; background: var(--field); color: var(--ink); border: 1px solid transparent; border-radius: 3px; font: inherit; outline: none; }
	input:hover { background: var(--field-hover); }
	input:focus { border-color: var(--accent); }
	input.invalid { border-color: var(--bad); }
	.chips { display: flex; gap: 4px; margin-top: 6px; }
	.chip { padding: 3px 9px; background: var(--field); color: var(--ink); border: 1px solid transparent; border-radius: 10px; font: inherit; font-size: 8pt; cursor: pointer; }
	.chip:hover { background: var(--field-hover); }
	.chip.on { border-color: var(--accent); color: #fff; }
	.howto { margin: 14px 0 0 106px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
	<div class="row">
		<label for="minutes">Minutes</label>
		<div>
			<input type="text" id="minutes" inputmode="numeric" placeholder="15" spellcheck="false" autocomplete="off">
			<div class="chips" id="chips"></div>
		</div>
	</div>
	<div class="howto">Adds time to the running session.<br>If it was counting up, it starts a countdown from now.</div>
<script>
	const PRESETS = ["5", "10", "15", "30"];
	let socket = null, contextId = null, settings = {};
	const $ = (id) => document.getElementById(id);

	window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
		contextId = uuid;
		settings = JSON.parse(actionInfo).payload?.settings ?? {};
		socket = new WebSocket(`ws://127.0.0.1:${port}`);
		socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
		socket.onmessage = (e) => {
			const message = JSON.parse(e.data);
			if (message.event === "didReceiveSettings") { settings = message.payload.settings ?? {}; render(); }
		};
		render();
	};

	const valid = (v) => v === "" || (/^\d+$/.test(v) && +v > 0 && +v <= 240);
	function save() { socket?.send(JSON.stringify({ event: "setSettings", context: contextId, payload: settings })); }
	function render() {
		const input = $("minutes");
		if (document.activeElement !== input) input.value = settings.minutes ?? "";
		input.classList.toggle("invalid", !valid(input.value.trim()));
		for (const chip of $("chips").children) chip.classList.toggle("on", chip.dataset.value === (settings.minutes || "15"));
	}

	$("chips").replaceChildren(...PRESETS.map((value) => {
		const chip = document.createElement("button");
		chip.type = "button"; chip.className = "chip"; chip.textContent = `+${value}`; chip.dataset.value = value;
		chip.onclick = () => { settings.minutes = value; $("minutes").value = value; save(); render(); };
		return chip;
	}));
	$("minutes").addEventListener("input", () => {
		const value = $("minutes").value.trim();
		if (valid(value)) { settings.minutes = value || undefined; save(); }
		render();
	});
</script>
</body>
</html>
